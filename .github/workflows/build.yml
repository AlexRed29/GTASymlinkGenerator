name: Build GTA Symlink Generator

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release Win32
  run: |
    msbuild "GTA Symlink Generator.vcxproj" /p:Configuration=Release /p:Platform=Win32 /v:detailed

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: GTA-Symlink-Generator
          path: 'Release/GTA Symlink Generator.exe'
