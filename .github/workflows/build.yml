name: Build GTA Symlink Generator

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild "GTA Symlink Generator.vcxproj" /p:Configuration=Release /p:Platform=Win32

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: GTA-Symlink-Generator
          path: "Release/GTASymlinkGenerator.exe"
